name: potato-project
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: potato_postgres
    environment:
      POSTGRES_USER: potato_user
      POSTGRES_PASSWORD: potato_password
      POSTGRES_DB: potato_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: potato_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    
volumes:
  postgres_data:
  redis_data:
  